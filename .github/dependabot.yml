# Atualizacoes semanais de dependencias. Minor e patch vem agrupados em um PR
# por ecossistema; major chega sempre em PR separado (nenhum grupo aceita
# major) e recebe o rotulo `revisar` (dependabot-revisao.yml). Toda PR do
# Dependabot passa pelo mesmo gate do CI (testes, Trivy e fumaca).
# Combinado desde 25/09/2026: um merge por vez, esperando o deploy terminar
# (deploy-contabo.md, secao "Merges e Dependabot").
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(backend)"
    # GORM e o driver Postgres ficam de fora ate uma atualizacao testada contra
    # o schema de producao. O #50 levou gorm 1.25.5 -> 1.31.2 e driver 1.5.4 ->
    # 1.6.3; o AutoMigrate novo tentou "DROP CONSTRAINT uni_despesas_ceaps_id_
    # origem", que nao existe (a unicidade antiga se chama despesas_ceaps_id_
    # origem_key), e a API nao subiu em producao em 25/09/2026. O CI nao pegou
    # porque testa num banco criado do zero.
    ignore:
      - dependency-name: "gorm.io/*"
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # O frontend instala com bun (frontend/Dockerfile usa bun.lock com
  # --frozen-lockfile). O ecossistema "npm" do Dependabot atualizaria o
  # package-lock.json, que nao entra no build; "bun" atualiza o bun.lock.
  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(frontend)"
    # Os tipos do Node acompanham a versao que roda em producao (Node 24 no
    # frontend/Dockerfile): tipos de uma major mais nova deixam o tsc aceitar
    # APIs que o runtime nao tem. Sobem junto com a imagem, a mao.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"
    # Major do Node fica de fora: o Dependabot propoe tambem as versoes impares
    # (o #51 levou a 25, sem suporte). A troca de major e manual, so para LTS.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      imagens-base:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      # Major de action (ex.: checkout v6 -> v7) muda entradas e o runtime do
      # Node da action: fica fora do grupo, em PR proprio.
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
