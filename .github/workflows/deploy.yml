name: Deploy to Contabo VPS

# Fluxo (push em master):
#   verificacao (testes, tipos, Trivy fs, build + Trivy das imagens)
#     -> publicar (push no GHCR das MESMAS imagens escaneadas, tag = SHA)
#     -> deploy (VPS so faz pull; ensaio da migracao numa copia do banco;
#        up --no-build; health check pelo NPM; rollback automatico para a
#        tag `producao` se o health check falhar)
#     -> marcar-producao (tag movel `producao` = ultima versao saudavel; e a
#        reserva do rollback automatico e o alvo da varredura agendada)
#
# Rollback: Actions -> Deploy to Contabo VPS -> Run workflow, informando em
# `tag` o SHA completo de um deploy anterior. Pula verificacao e publicacao e
# so reimplanta aquela tag, que ja esta no GHCR (ver deploy-contabo.md).

on:
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Rollback: SHA completo (40 caracteres) ja publicado no GHCR. Vazio = build e deploy do commit atual."
        type: string
        required: false
        default: ""

concurrency:
  group: deploy-contabo
  cancel-in-progress: false

# Nada por padrao; cada job pede so o que usa.
permissions: {}

env:
  REMOTE_DIR: /opt/todeolho
  REGISTRO: ghcr.io/alzarus

jobs:
  verificacao:
    if: ${{ !inputs.tag }}
    uses: ./.github/workflows/verificacao.yml
    permissions:
      contents: read
    with:
      publicar: true
    secrets:
      TRANSPARENCIA_API_KEY: ${{ secrets.TRANSPARENCIA_API_KEY }}

  # Unico job com packages: write. Nao faz checkout nem build: carrega o
  # artefato salvo depois do Trivy, confere o ID e publica.
  publicar:
    needs: verificacao
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Baixar imagens escaneadas
        uses: actions/download-artifact@v8
        with:
          pattern: imagem-*
          merge-multiple: true
          path: /tmp/imagem

      - name: Carregar e conferir que e a imagem escaneada
        run: |
          set -euo pipefail
          for servico in api web; do
            imagem="$REGISTRO/todeolho-$servico:$GITHUB_SHA"
            gunzip -c "/tmp/imagem/$servico.tar.gz" | docker load
            esperado=$(cat "/tmp/imagem/$servico.id")
            obtido=$(docker image inspect --format '{{.Id}}' "$imagem")
            if [ "$esperado" != "$obtido" ]; then
              echo "::error::$imagem carregada ($obtido) difere da escaneada ($esperado)"
              exit 1
            fi
            echo "[OK] $imagem = $obtido"
          done

      - name: Login no GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar no GHCR
        run: |
          set -euo pipefail
          for servico in api web; do
            docker push "$REGISTRO/todeolho-$servico:$GITHUB_SHA"
          done

  # ============================================================================
  # Deploy na VM Contabo via SSH: so puxa imagens prontas do GHCR
  # ============================================================================
  deploy:
    needs: [verificacao, publicar]
    # Push/dispatch sem tag: exige verificacao + publicacao ok.
    # Rollback (dispatch com tag): os dois jobs acima sao pulados de proposito.
    if: >-
      ${{ !cancelled() && (
        (inputs.tag && needs.verificacao.result == 'skipped') ||
        (!inputs.tag && needs.publicar.result == 'success')
      ) }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      # O GITHUB_TOKEN deste job vai (por stdin) para o docker login na VPS.
      packages: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Definir tag
        id: tag
        env:
          TAG_ROLLBACK: ${{ inputs.tag }}
        run: |
          tag="${TAG_ROLLBACK:-$GITHUB_SHA}"
          # So SHA completo: evita implantar tag movel ou digitada errada.
          if ! printf '%s' "$tag" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::tag invalida '$tag': informe o SHA completo (40 hex, minusculas)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Implantando imagens com tag \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar SSH (chave de deploy + known_hosts fixo)
        env:
          SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          SSH_HOST: ${{ secrets.CONTABO_HOST }}
          SSH_USER: ${{ secrets.CONTABO_USER }}
          KNOWN_HOSTS: ${{ secrets.CONTABO_KNOWN_HOSTS }}
        run: |
          # Chave do host fixada em secret: sem ssh-keyscan a cada execucao,
          # que aceitaria qualquer chave apresentada (inclusive de um MITM).
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Secret CONTABO_KNOWN_HOSTS vazio ou ausente. Gere as linhas com ssh-keyscan, confira os fingerprints no console da VPS e salve no environment production (ver deploy-contabo.md, secao 3)."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          # Alias "vps" usado por todos os ssh/scp abaixo.
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            # O passo de implantacao pode ficar minutos sem saida (espera da
            # API, rollback): o keepalive impede que a sessao caia calada.
            ServerAliveInterval 30
            ServerAliveCountMax 6
          EOF
          chmod 600 ~/.ssh/config

      - name: Enviar docker-compose.contabo.yml
        run: |
          # A VPS nao recebe mais codigo-fonte: so o compose, que referencia
          # as imagens do GHCR pela tag gravada no .env.
          ssh vps "mkdir -p ${{ env.REMOTE_DIR }}"
          scp docker-compose.contabo.yml "vps:${{ env.REMOTE_DIR }}/docker-compose.contabo.yml"

      - name: Gerar .env de producao a partir dos secrets
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          TRANSPARENCIA_API_KEY: ${{ secrets.TRANSPARENCIA_API_KEY }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          # O heredoc segue por stdin do ssh: nenhum segredo aparece na linha
          # de comando nem no log do runner (o Actions ja mascara os valores).
          # A expansao e local de proposito (os valores estao no runner).
          # A linha IMAGE_TAG do .env antigo e mantida: quem troca a versao e
          # o implantar.sh, depois do ensaio. Se o ensaio barrar a versao nova,
          # o .env continua descrevendo o que esta no ar.
          # shellcheck disable=SC2087
          ssh vps "cd ${{ env.REMOTE_DIR }} && umask 077 && t=\$(grep -m1 '^IMAGE_TAG=' .env 2>/dev/null || true) && cat > .env.novo && { [ -z \"\$t\" ] || printf '%s\n' \"\$t\" >> .env.novo; } && mv .env.novo .env" <<EOF
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          TRANSPARENCIA_API_KEY=${TRANSPARENCIA_API_KEY}
          SYNC_SECRET=${SYNC_SECRET}
          NEXT_PUBLIC_API_URL=https://todeolho.org
          INICIO_BACKFILL=2023
          EOF

      - name: Pull das imagens (nova e reserva do rollback)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Token, usuario e tag vao nas tres primeiras linhas do stdin; o
          # restante e o script. Nada sensivel na linha de comando do ssh.
          {
            printf '%s\n%s\n%s\n' "$GHCR_TOKEN" "$GHCR_USER" "$IMAGE_TAG"
            cat <<'REMOTE'
          set -euo pipefail
          cd /opt/todeolho

          # Credencial em DOCKER_CONFIG temporario: nao sobrescreve nem desloga
          # o ~/.docker/config.json usado pelos outros projetos da VPS.
          DOCKER_CONFIG=$(mktemp -d)
          export DOCKER_CONFIG
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          # Mantem o plugin compose se ele estiver instalado por usuario.
          if [ -d "$HOME/.docker/cli-plugins" ]; then
            ln -s "$HOME/.docker/cli-plugins" "$DOCKER_CONFIG/cli-plugins"
          fi

          # A rede da VPS falha de forma intermitente em dois pontos: DNS local
          # (lookup ghcr.io on 127.0.0.53: i/o timeout, deploy do #58) e conexao
          # IPv6 com o GHCR (connection reset by peer, deploys do #45/#46 e #57).
          # Login e pull passam pelo mesmo `repetir`: ate 5 tentativas com
          # espera crescente. `</dev/null` porque o script chega por stdin.
          repetir() {
            local rotulo="$1" tentativa; shift
            for tentativa in 1 2 3 4 5; do
              if "$@" </dev/null; then return 0; fi
              if [ "$tentativa" = 5 ]; then echo "[FALHA] $rotulo falhou 5 vezes"; return 1; fi
              echo "[AVISO] $rotulo falhou (tentativa $tentativa de 5); nova tentativa em $((tentativa * 10)) s"
              sleep $((tentativa * 10))
            done
          }
          login_ghcr() { printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin; }
          repetir "login no GHCR" login_ghcr
          unset GHCR_TOKEN

          # </dev/null: o script chega por stdin; nenhum comando pode consumi-lo.
          # IMAGE_TAG exportada vale mais que a do .env (que ainda aponta a
          # versao no ar): o pull traz a nova sem trocar nada ainda.
          compose="docker compose -f docker-compose.contabo.yml --env-file .env"
          # So api e web: o postgres nao muda de versao sozinho num deploy.
          # O docker aproveita as camadas ja baixadas: repetir o pull converge.
          repetir "pull do GHCR" $compose pull api web

          # Reserva do rollback automatico (implantar.sh): as imagens da tag
          # `producao`, a ultima versao que passou no health check. Ficam
          # locais antes de qualquer troca, para o rollback nao depender da
          # rede. Tag inexistente (primeiro deploy) nao e erro: o deploy segue
          # sem rollback automatico, e o implantar.sh avisa. Falha de rede, sim:
          # sem reserva garantida, nao se troca a versao no ar.
          puxar_reserva() {
            local img="ghcr.io/alzarus/todeolho-$1:producao" saida tentativa
            for tentativa in 1 2 3 4 5; do
              if saida=$(docker pull -q "$img" 2>&1 </dev/null); then
                echo "[OK] reserva $img"; return 0
              fi
              case "$saida" in
                *"manifest unknown"*|*"not found"*)
                  echo "[AVISO] $img nao existe no GHCR: deploy sem rollback automatico"
                  docker image rm "$img" >/dev/null 2>&1 </dev/null || true
                  return 0 ;;
              esac
              [ "$tentativa" = 5 ] && { echo "[FALHA] pull da reserva $img: $saida"; return 1; }
              echo "[AVISO] pull da reserva falhou (tentativa $tentativa de 5); nova tentativa em $((tentativa * 10)) s"
              sleep $((tentativa * 10))
            done
          }
          puxar_reserva api
          puxar_reserva web
          REMOTE
          } | ssh vps 'IFS= read -r GHCR_TOKEN && IFS= read -r GHCR_USER && IFS= read -r IMAGE_TAG && export GHCR_TOKEN GHCR_USER IMAGE_TAG && exec bash -se'

      # A imagem nova da API sobe contra uma COPIA do banco de producao antes
      # de qualquer troca. Barra migracao que quebra no schema real, como a do
      # GORM 1.31.2 em 25/09 (o CI testa com banco vazio e nao pega). Falhou
      # aqui, a producao nao foi tocada. Detalhes em scripts/deploy/.
      - name: Ensaio da migracao numa copia do banco
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: ssh vps bash -s -- "$IMAGE_TAG" < scripts/deploy/ensaio-migracao.sh

      # up + health check (API, loopback e caminho publico pela 443 do NPM).
      # Se falhar, o implantar.sh volta sozinho para a tag `producao` e o job
      # termina em falha, com o motivo e a versao restaurada no resumo.
      - name: Implantar (health check e rollback automatico)
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          rc=0
          ssh vps bash -s -- "$IMAGE_TAG" < scripts/deploy/implantar.sh | tee /tmp/implantar.log || rc=$?
          { echo "### Implantacao"; sed -n 's/^RESULTADO: //p' /tmp/implantar.log; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # Sem `docker builder prune`: a VPS nao compila mais nada.
      - name: Limpeza de imagens antigas
        if: success()
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ssh vps bash -se -- "$IMAGE_TAG" <<'REMOTE'
          set -uo pipefail
          atual="$1"
          # Remove so imagens do proprio projeto: tags antigas do GHCR (o
          # rollback puxa de novo do registro) e as :latest do tempo em que a
          # VPS compilava. Nao usa `prune -a`, que apagaria imagens paradas
          # dos outros projetos da VPS. Imagem em uso falha no rmi e fica.
          docker image ls --format '{{.Repository}}:{{.Tag}}' \
            | grep -E '^(ghcr\.io/alzarus/todeolho-(api|web)|todeolho-(api|web)):' \
            | grep -v ":${atual}\$" \
            | xargs -r docker rmi 2>/dev/null || true
          # Camadas sem tag que sobraram.
          docker image prune -f </dev/null
          REMOTE

      - name: Remover chave SSH do runner
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config

  # Tag movel `producao` = o que esta no ar. A varredura agendada
  # (seguranca-agendada.yml) escaneia essa tag. So roda apos health check ok.
  marcar-producao:
    needs: deploy
    # !cancelled(): no rollback os jobs anteriores ao deploy foram pulados, e
    # sem isso o GitHub pularia este job tambem.
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login no GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Aplicar tag producao
        env:
          IMAGE_TAG: ${{ needs.deploy.outputs.tag }}
        run: |
          set -euo pipefail
          # Copia so o manifesto no registro, sem baixar as camadas.
          for servico in api web; do
            docker buildx imagetools create \
              -t "$REGISTRO/todeolho-$servico:producao" \
              "$REGISTRO/todeolho-$servico:$IMAGE_TAG"
          done
          echo "Tag producao -> \`$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
