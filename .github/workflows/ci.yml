name: CI

# Gate de pull request. A verificacao em si (testes, tipos, Trivy do repo e
# build + Trivy das imagens) mora no verificacao.yml, o mesmo que o deploy.yml
# chama em master antes de publicar. Aqui nada e publicado: o GITHUB_TOKEN so
# le o repositorio.
#
# Sem gatilho de push em master: la o deploy.yml ja roda a mesma verificacao
# como pre-requisito do deploy; rodar aqui tambem so duplicaria o build.

on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacao:
    uses: ./.github/workflows/verificacao.yml
    with:
      publicar: false
    secrets:
      TRANSPARENCIA_API_KEY: ${{ secrets.TRANSPARENCIA_API_KEY }}
