name: Disponibilidade

# Monitoramento externo simples: se o site cair, o job falha e o GitHub manda
# e-mail ao dono do repositorio. Nao substitui um servico de uptime (o cron do
# Actions pode atrasar alguns minutos em horario de pico), mas custa zero.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: disponibilidade
  cancel-in-progress: true

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checar rotas publicas
        run: |
          set -u
          base="https://todeolho.org"
          falhas=0

          # Tres tentativas com 10 s de intervalo antes de declarar queda:
          # evita alarme falso por um soluco de rede do runner.
          checar() {
            local rota="$1" esperado="$2" code=""
            for tentativa in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                --connect-timeout 10 --max-time 20 \
                -A "todeolho-disponibilidade (github actions)" \
                "$base$rota") || true
              if [ "$code" = "$esperado" ]; then
                echo "[OK] $rota -> $code"
                return 0
              fi
              [ "$tentativa" -lt 3 ] && sleep 10
            done
            echo "::error::$rota retornou HTTP $code (esperado $esperado)"
            falhas=$((falhas + 1))
          }

          checar / 200
          checar /ranking 200
          checar /api/v1/ranking 200
          checar /quemvotar/ 200
          # Rota de sync bloqueada na borda: se voltar a responder outra coisa
          # que 404, o bloqueio no proxy foi desfeito.
          checar /api/v1/sync/daily 404

          if [ "$falhas" -gt 0 ]; then
            echo "$falhas verificacao(oes) falharam."
            exit 1
          fi
