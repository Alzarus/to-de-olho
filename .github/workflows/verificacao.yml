name: Verificacao

# Workflow reutilizavel (workflow_call) com TODA a verificacao do projeto:
# testes do backend, tipos do frontend, Trivy do repositorio, build + Trivy
# das imagens e teste de fumaca das imagens (db + api + web no ar). Chamado pelo ci.yml (pull request, sem publicar) e pelo
# deploy.yml (master, publicando). Assim o gate do PR e o gate do deploy sao
# o mesmo arquivo e nao divergem com o tempo.
#
# Por que reusable workflow e nao composite action: aqui ha varios jobs
# paralelos (e uma matriz), e composite action so empacota steps de um job.
#
# Este workflow nunca publica no GHCR nem pede packages: write. As imagens ja
# escaneadas vao como artefato para o job `fumaca` e, quando `publicar` e
# true, para o job `publicar` do deploy.yml (unico com packages: write), que
# faz o push dessas mesmas imagens, sem reconstruir.

on:
  workflow_call:
    inputs:
      publicar:
        description: Salvar as imagens escaneadas como artefato para publicacao
        type: boolean
        default: false
    secrets:
      TRANSPARENCIA_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Run Tests
        env:
          TRANSPARENCIA_API_KEY: ${{ secrets.TRANSPARENCIA_API_KEY }}
        run: go test ./...

  # O `next build` da imagem ja checa tipos, mas o tsc isolado falha em
  # segundos e aponta o arquivo, sem esperar o build inteiro.
  frontend-tipos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Mesma versao da imagem oven/bun do frontend/Dockerfile.
          bun-version: 1.3.14

      - name: Instalar dependencias (bun.lock)
        run: bun install --frozen-lockfile

      - name: Checagem de tipos
        run: bunx tsc --noEmit

  # Varredura de dependencias e segredos. Falha so em CRITICAL; o que for
  # aceito conscientemente vai para o .trivyignore com justificativa.
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy (dependencias e segredos)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
          version: v0.74.0

  # Build das imagens de producao no runner (e nao mais na VPS) e varredura
  # da MESMA imagem que sera publicada: o Trivy le a imagem carregada no
  # docker local, e o artefato salvo depois do scan e o que vai para o GHCR.
  # A varredura de arquivos (trivy-fs) nao enxerga a imagem base (Go stdlib no
  # binario, pacotes do alpine, npm embutido no node). Falha em CRITICAL/HIGH
  # que ja tenham correcao publicada.
  imagens:
    name: imagem ${{ matrix.servico }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - servico: api
            contexto: ./backend
            build-args: ""
            descricao: API Go do To De Olho
          - servico: web
            contexto: ./frontend
            # NEXT_PUBLIC_* e embutido no bundle no build; nao muda em runtime.
            build-args: NEXT_PUBLIC_API_URL=https://todeolho.org
            descricao: Frontend Next.js do To De Olho
    env:
      # Nome no GHCR sempre em minusculas; tag = SHA completo do commit.
      IMAGEM: ghcr.io/alzarus/todeolho-${{ matrix.servico }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (${{ matrix.servico }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.contexto }}
          build-args: ${{ matrix.build-args }}
          tags: ${{ env.IMAGEM }}
          # A label source liga o pacote do GHCR a este repositorio (herda
          # acesso e aparece na pagina do repo).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=todeolho-${{ matrix.servico }}
            org.opencontainers.image.description=${{ matrix.descricao }}
          # Carrega no docker local para o Trivy; push nunca daqui.
          load: true
          push: false
          # Atestados nao sobrevivem ao `load` no docker e so gerariam aviso.
          provenance: false
          # Sempre resolve a tag base no registro: correcoes da imagem base
          # (ex.: tzdata/openssl) entram no proximo build sem mexer no codigo.
          pull: true
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}

      - name: Trivy (imagem ${{ matrix.servico }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGEM }}
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          version: v0.74.0

      # So chega aqui se o Trivy passou. O ID da imagem, lido do mesmo docker
      # que o Trivy escaneou, vai junto para o job de publicacao conferir que
      # carregou exatamente esta imagem (save/load preserva o ID). Salva
      # tambem no PR: o job `fumaca` sobe estas imagens.
      - name: Salvar imagem escaneada
        run: |
          set -euo pipefail
          mkdir -p /tmp/imagem
          docker image inspect --format '{{.Id}}' "$IMAGEM" > "/tmp/imagem/${{ matrix.servico }}.id"
          docker save "$IMAGEM" | gzip -1 > "/tmp/imagem/${{ matrix.servico }}.tar.gz"

      - name: Enviar artefato
        uses: actions/upload-artifact@v7
        with:
          name: imagem-${{ matrix.servico }}
          path: /tmp/imagem/
          retention-days: 1
          if-no-files-found: error

  # Sobe as imagens recem-construidas com o MESMO docker-compose.contabo.yml
  # da VPS e exige 200 nas rotas que o publico usa. Scanner e teste unitario
  # nao pegam imagem que nao sobe junto: rewrite do Next para a API, variavel
  # obrigatoria faltando, erro de hidratacao ou de CSP no navegador. O
  # Playwright confere o grafico do senador (svg do Recharts e tooltip), a
  # checagem manual que validou o deploy do #60. O banco e novo e semeado com
  # um senador; migracao sobre o schema real e trabalho do ensaio no deploy.
  fumaca:
    name: fumaca (db + api + web)
    needs: imagens
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Baixar imagens escaneadas
        uses: actions/download-artifact@v8
        with:
          pattern: imagem-*
          merge-multiple: true
          path: /tmp/imagem

      - name: Carregar imagens
        run: |
          for servico in api web; do
            gunzip -c "/tmp/imagem/$servico.tar.gz" | docker load
          done

      - name: Subir db, api e web (compose de producao)
        run: |
          # A rede do NPM e externa no compose de producao.
          docker network create proxy_default
          cat > /tmp/fumaca.env <<EOF
          POSTGRES_USER=todeolho
          POSTGRES_PASSWORD=fumaca
          POSTGRES_DB=todeolho
          TRANSPARENCIA_API_KEY=fumaca
          SYNC_SECRET=fumaca
          SCHEDULER_DESATIVADO=true
          IMAGE_TAG=${IMAGE_TAG}
          EOF
          docker compose -f docker-compose.contabo.yml --env-file /tmp/fumaca.env up -d --no-build

      - name: API saudavel e banco semeado
        run: |
          # Mesma sondagem do deploy: da rede interna, a partir do conteiner web.
          for i in $(seq 1 36); do
            if docker exec todeolho-web node -e \
              "require('http').get('http://api:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" 2>/dev/null; then
              echo "[OK] API respondendo /health"
              break
            fi
            if [ "$i" = 36 ]; then echo "::error::API sem /health 200 em 3 min"; exit 1; fi
            sleep 5
          done
          docker exec -i todeolho-db psql -U todeolho -d todeolho -v ON_ERROR_STOP=1 -q < scripts/ci/fumaca-semente.sql

      - name: Rotas publicas respondem 200
        run: |
          falhas=0
          for rota in / /ranking /senador/1 /api/v1/ranking; do
            code=""
            for _ in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "http://127.0.0.1:5350$rota" || true)
              [ "$code" = 200 ] && break
              sleep 5
            done
            if [ "$code" = 200 ]; then echo "[OK] $rota -> 200"; else echo "::error::$rota -> HTTP $code"; falhas=$((falhas + 1)); fi
          done
          exit "$falhas"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Grafico do senador no navegador (Playwright)
        working-directory: ./frontend
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:5350
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bunx playwright test e2e/fumaca.spec.ts --project=chromium --reporter=list

      - name: Logs dos conteineres
        if: failure()
        run: docker compose -f docker-compose.contabo.yml --env-file /tmp/fumaca.env logs --tail=80
