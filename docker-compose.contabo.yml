services:
  db:
    image: postgres:15-alpine
    container_name: todeolho-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER obrigatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB obrigatorio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - todeolho_internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    # Imagem construida e escaneada (Trivy) no GitHub Actions e publicada no
    # GHCR com a tag = SHA do commit. A VPS so faz pull; build local fica no
    # docker-compose.contabo.build.yml.
    image: ghcr.io/alzarus/todeolho-api:${IMAGE_TAG:?IMAGE_TAG obrigatorio (SHA publicado no GHCR)}
    container_name: todeolho-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - PORT=8080
      - GIN_MODE=release
      - TRANSPARENCIA_API_KEY=${TRANSPARENCIA_API_KEY:?TRANSPARENCIA_API_KEY obrigatorio}
      - SYNC_SECRET=${SYNC_SECRET:?SYNC_SECRET obrigatorio}
      - INICIO_BACKFILL=${INICIO_BACKFILL:-2023}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todeolho_internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    # NEXT_PUBLIC_API_URL e embutido no bundle no build (CI, verificacao.yml);
    # a variavel abaixo so vale para o lado servidor.
    image: ghcr.io/alzarus/todeolho-web:${IMAGE_TAG:?IMAGE_TAG obrigatorio (SHA publicado no GHCR)}
    container_name: todeolho-web
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://api:8080
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://todeolho.org}
      - NODE_ENV=production
    # Exposto no loopback para validacao interna, seguindo o padrao dos
    # demais projetos da VM (quemvotar:5340, neuroanalises:5333, blazebot:5360).
    ports:
      - "127.0.0.1:5350:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      - api
    networks:
      - todeolho_internal
      # Necessaria para que o Nginx Proxy Manager (proxy-app-1) resolva
      # "todeolho-web" pelo DNS interno do Docker.
      - proxy_default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:

networks:
  # Rede compartilhada ja existente na VM, gerenciada pela stack /opt/proxy.
  proxy_default:
    external: true
  todeolho_internal:
    driver: bridge
