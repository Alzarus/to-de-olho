version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: todeolho-db
    restart: unless-stopped
    env_file:
      - .env.gsort
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-todeolho}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todeolho-api
    restart: unless-stopped
    env_file:
      - .env.gsort
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-todeolho}?sslmode=disable
      - PORT=${PORT_API:-8080}
      - TRANSPARENCIA_API_KEY=${TRANSPARENCIA_API_KEY:-""}
      - GIN_MODE=release
    ports:
      - "${PORT_API:-8080}:${PORT_API:-8080}"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: todeolho-web
    restart: unless-stopped
    env_file:
      - .env.gsort
    environment:
      - BACKEND_URL=http://api:${PORT_API:-8080}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      - NODE_ENV=production
    ports:
      - "${PORT_WEB:-3000}:3000"
    depends_on:
      - api

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: todeolho-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web

volumes:
  postgres_data:
